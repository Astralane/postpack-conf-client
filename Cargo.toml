[package]
name = "astralane-preconf-client"
description = "Client for Astralane preconfirmation streams"
version = "0.1.0"
edition = "2024"

[dependencies]
agave-transaction-view = { version = "4.1.0-beta.1", features = ["agave-unstable-api"] }
bincode = "1.3"
bytes = "1"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
solana-pubkey = "4.2"
solana-signature = "3.4"
solana-transaction = { version = "4.1.2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "tls-ring",
    "tls-native-roots",
] }
tonic-prost = "0.14"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
