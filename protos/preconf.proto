syntax = "proto3";

// The subscriber half of the schema the Astralane preconfirmation relay serves,
// itself derived from https://github.com/rpcpool/harmonic-preconf-example

package preconf;

service PreconfService {
  rpc SubscribePreconfs(SubscribePreconfsRequest) returns (stream PreconfStreamMessage);
}

message SubscribePreconfsRequest {
  // Empty AOI and POI means no inline filtering.
  repeated bytes accounts_of_interest = 1;
  repeated bytes programs_of_interest = 2;
}

message ValidatorSlotStart {
  bytes leader_address = 1;
  uint64 slot = 2;
  // The leader's clock, in nanoseconds since the unix epoch. Zero means the leader
  // announced no slot boundary and this one was derived from its first transaction.
  uint64 server_side_timestamp = 3;
}

message Preconf {
  uint64 slot = 1;
  // Raw serialized Solana transaction.
  bytes data = 2;
  uint64 transaction_index = 3;
}

message PreconfStreamMessage {
  oneof message {
    ValidatorSlotStart validator_slot_start = 1;
    Preconf preconf = 2;
  }
}
